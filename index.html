<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Your Name] — Portfolio</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════
       PARTICLE CANVAS — fixed behind everything
  ═══════════════════════════════════════════════════ -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- ═══════════════════════════════════════════════════
       MAIN — hero section
  ═══════════════════════════════════════════════════ -->
  <main class="main" role="main">
    <section class="hero" aria-label="Hero section">

      <!-- The solid blue rectangular box panel -->
      <div class="hero__panel" role="presentation">

        <!-- Upper two-thirds: headline + sub + CTA -->
        <div class="hero__content">
          <!-- PLACEHOLDER: Replace with your headline -->
          <h1 class="hero__headline">
            Building things<br />
            that move markets.
          </h1>

          <!-- PLACEHOLDER: Replace with your one-line tagline -->
          <p class="hero__subtitle">
            [Tagline — e.g. "Full-stack engineer &amp; quant researcher."]
          </p>

          <!-- PLACEHOLDER: Update href and label for your CTA -->
          <a href="#work" class="hero__cta" aria-label="See my work">
            See My Work
          </a>
        </div>

      </div><!-- /.hero__panel -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
